<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>AstroHub Meteor Counter</title><style>:root{font-family:system-ui,sans-serif;background:#000;color:#a92520}*{box-sizing:border-box}body{margin:0;min-height:100dvh}.app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:14px}header{display:flex;justify-content:space-between;align-items:center}small{opacity:.65}.count{text-align:center;font-size:clamp(4rem,25vw,9rem);font-weight:800;line-height:1}.hit{width:min(78vw,420px);aspect-ratio:1;margin:auto;border-radius:50%;border:2px solid #7e1c18;background:#130000;color:#b62b25;font-size:clamp(1.4rem,7vw,2.4rem);font-weight:800;touch-action:manipulation}.hit:active{background:#280000;transform:scale(.985)}footer{display:grid;grid-template-columns:1fr 1fr;gap:8px}button.secondary{border:1px solid #49110f;background:#080000;color:#8f211c;padding:12px;border-radius:12px}.status{text-align:center;font-size:.8rem;opacity:.65}.flash{animation:f .18s}@keyframes f{50%{background:#3a0000}}</style></head><body><main class="app" id="app"><header><b>☄️ My Meteore</b><small id="clock">--:--:--</small></header><section><div class="count" id="count">0</div><p class="status" id="status">Bereit · lokal</p><button class="hit" id="hit">METEOR<br><small>ANTIPPEN</small></button></section><footer><button class="secondary" id="undo">Letzten entfernen</button><button class="secondary" id="export">JSON exportieren</button></footer></main><script>const KEY='astrohub.meteor.current';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{id:crypto.randomUUID(),startedAt:new Date().toISOString(),events:[]};const count=document.querySelector('#count'),status=document.querySelector('#status'),app=document.querySelector('#app');function save(){localStorage.setItem(KEY,JSON.stringify(data));count.textContent=data.events.length}function hit(){const now=Date.now();data.events.push({id:crypto.randomUUID(),observed_at:new Date(now).toISOString(),observed_at_ms:now,input_method:'touch',synced:false});save();status.textContent=`Gespeichert · ${new Date(now).toLocaleTimeString()}`;app.classList.remove('flash');void app.offsetWidth;app.classList.add('flash');navigator.vibrate?.(25)}document.querySelector('#hit').onclick=hit;document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();hit()}});document.querySelector('#undo').onclick=()=>{data.events.pop();save()};document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`astrohub-meteors-${data.id}.json`;a.click();URL.revokeObjectURL(a.href)};setInterval(()=>document.querySelector('#clock').textContent=new Date().toLocaleTimeString(),250);save();</script></body></html>
